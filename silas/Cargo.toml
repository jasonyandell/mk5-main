[package]
name = "silas"
version = "0.1.0"
edition = "2024"
description = "Silas: a typed relational query and policy language over the worlds consistent with what a seat of Texas 42 knows"
license = "CC0-1.0"
publish = false

# Standalone: depends on no other crate in this repository.
[workspace]

[features]
default = ["cli"]
# The `silas` command (src/bin/silas.rs), which reads the book's hands.
cli = ["dep:serde_json"]

[dependencies]
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "silas"
path = "src/bin/silas.rs"
required-features = ["cli"]

[[example]]
name = "solve_grade"
path = "examples/book/solve_grade.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
float_arithmetic = "deny"

# Debug builds (the `cargo test` gate) at opt-level 1: the outcome and solver
# tests are exhaustive searches that run over five minutes unoptimized.
[profile.dev]
opt-level = 1
