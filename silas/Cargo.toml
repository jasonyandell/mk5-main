[package]
name = "silas"
version = "0.1.0"
edition = "2024"
description = "Silas: a typed relational query and policy language over the worlds consistent with what a seat of Texas 42 knows"
license = "CC0-1.0"
publish = false

# Standalone: depends on no other crate in this repository.
[workspace]

[features]
default = ["cli"]
# The `silas` command (src/bin/silas.rs), which reads the book's hands.
cli = ["dep:serde_json"]
# STRATEGY-FUSION FENCE: the clairvoyant (double-dummy, perfect-information)
# reference: `ClairvoyantSolver`, `clairvoyant_grade_line` and the World atom
# `(clairvoyant-dd-make)`. Each sees all four hands, so its value used as a
# value is strategy fusion. Off by default: a plain `silas` build does not
# expose it. Allowed instead: information-state solving (`(certain-make)`,
# `(certain-set)`, `(lay-down)`, Zeb). The ruling: wiki/topics/strategy-fusion-fence.md.
clairvoyant = []

[dependencies]
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
# STRATEGY-FUSION FENCE: the tests and the showcase enable the clairvoyant
# reference explicitly; the library's consumers do not get it.
silas = { path = ".", features = ["clairvoyant"] }

[[bin]]
name = "silas"
path = "src/bin/silas.rs"
required-features = ["cli"]

[[example]]
name = "clairvoyant_grade"
path = "examples/book/clairvoyant_grade.rs"
required-features = ["clairvoyant"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
float_arithmetic = "deny"

# Debug builds (the `cargo test` gate) at opt-level 1: the outcome and solver
# tests are exhaustive searches that run over five minutes unoptimized.
[profile.dev]
opt-level = 1
