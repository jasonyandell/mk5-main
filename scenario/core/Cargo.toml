[package]
name = "scenario_core"
version = "0.1.0"
edition = "2021"
description = "The compiled core of the scenario player (Walt) — the planner in scenario/planner.py, bit for bit"
publish = false

[lib]
name = "scenario_core"
crate-type = ["cdylib", "rlib"]

[features]
# The pyo3 module `scenario_core` (maturin turns it on; see pyproject.toml).
# It is tested from Python (`pytest scenario/tests`); `cargo test` runs the
# plain crate, since a pyo3 test binary cannot load libpython on its own.
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.23", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
