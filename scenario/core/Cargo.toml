[package]
name = "scenario_core"
version = "0.1.0"
edition = "2021"
description = "The compiled core of the scenario player (Walt) — the planner in scenario/planner.py, bit for bit"
publish = false

[lib]
name = "scenario_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
