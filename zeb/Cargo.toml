[package]
name = "zeb"
version = "0.4.1"
edition = "2021"
description = "Zeb: the Texas 42 scenario player, compiled to WebAssembly"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
scenario_core = { path = "../scenario/core", default-features = false }
console_error_panic_hook = "0.1"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The planner is the hot path even in tests; keep the debug build quick to run.
[profile.dev.package.scenario_core]
opt-level = 3
